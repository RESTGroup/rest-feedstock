

package:
  name: "rest"
  version: "2026.1.1.1"

source:
  - git: ssh://git@gitee.com/restgroup/rest.git
  #- git: https://gitee.com/canarias/rest.git
    rev: acbf7ca622afa0e8cfad18c93cd4391bb2519bd8
    #branch: for-win
    target_directory: rest
  - git: ssh://git@gitee.com/restgroup/rest_tensors.git
  #- git: https://gitee.com/canarias/rest_tensors.git
    #tag: v2025.02
    rev: 3df708b2e72c2e5b652f5a597140e3756e76dde2
    #branch: for-win
    target_directory: rest_tensors
  - git: ssh://git@gitee.com/restgroup/rest_libcint.git
  #- git: https://gitee.com/canarias/rest_libcint.git
    #tag: v2025.01
    rev: 399d937070a98544889687d5ed3b3aa96d38cbef
    #rev: 217c21a00a45cb41a45a4bafbd0f818f6d95dd04
    #branch: thread-safe
    target_directory: rest_libcint
  - git: ssh://git@gitee.com/restgroup/rest_regression.git
  #- git: https://gitee.com/canarias/rest_regression.git
    #tag: v2025.02
    rev: 94baafd4b486cd61ba931c53152e90932fb63aba
    #branch: timeout
    target_directory: rest_regression

build:
  number: 0
  string: ${{ "scalapack_" if scalapack != "disabled" else "" }}h${{ hash }}
  variant:
    use_keys:
      - scalapack
    down_prioritize_variant: ${{ 1 if scalapack != "disabled" else 0 }}
  files:
    exclude:
      - "**/__pycache__"
      - "**/test-files"
  script:
    env:
      REST_HOME: ${SRC_DIR}
      CONDA_BUILD_WINSDK: ${{ '${BUILD_PREFIX}/x86_64-w64-mingw32/sysroot' if target_platform == 'win-64' else '' }}
      WITH_SCALAPACK: ${{ '1' if scalapack != 'disabled' else '0' }}

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - if: win
      then: m2w64-sysroot_win-64
    - if: not win
      then: ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - if: win
      then: rust-std-x86_64-pc-windows-gnu
    - if: win
      then: libclang
      else: libclang 21.*
    - hdf5
    - libcint
    - openblas * openmp*
    - python
    - libxc-c
    - if: not win
      then: openmpi 4.*
    - mokit
    - geometric
    - simple-dftd3
    - dftd4
    - if: osx
      then: llvm-openmp
  host:
    - blas * *openblas
    - hdf5
    - libcint
    - openblas * openmp*
    - python
    - libxc-c
    - if: not win
      then: openmpi 4.*
    - mokit
    - h5py
    - geometric
    - simple-dftd3
    - dftd4
    - if: scalapack != "disabled"
      then: scalapack
    - if: osx
      then: llvm-openmp
  run:
    - hdf5
    - libcint
    - openblas * openmp*
    - python
    - libxc-c
    - if: not win
      then: openmpi 4.*
    - mokit
    - h5py
    - geometric
    - simple-dftd3
    - dftd4
    - if: scalapack != "disabled"
      then: scalapack

tests:
  - if: not win
    then:
      script: run_tests.sh
      requirements:
        run:
          - restgroup::rest_regression
      files:
        source:
          - rest_regression

about:
  homepage: https://gitee.com/restgroup/rest
  summary: "Rust-based Electronic-Structure Toolkit (REST), aiming at an efficient computational platform for state-of-the-art DFT and WFT methods."
  description: |
    Rust-based Electronic-Structure Toolkit (REST), 
    aiming at an efficient computational platform for state-of-the-art DFT and WFT methods.
  license: GPL-2.0-only
#   # The license_family, i.e. "BSD" if license is "BSD-3-Clause".
#   # Optional
#   license_family: MIT
#   # It is required to include a license file in the package,
#   # (even if the license doesn't require it) using the license_file entry.
#   # Please also note that some projects have multiple license files which all need to be added using a valid yaml list.
#   # See https://docs.conda.io/projects/conda-build/en/latest/resources/define-metadata.html#license-file
#   license_file: LICENSE.txt
#   # The doc_url and dev_url are optional.
  documentation: https://rest-doc.readthedocs.io/en/index.html

extra:
  recipe-maintainers:
    - jeanwsr
